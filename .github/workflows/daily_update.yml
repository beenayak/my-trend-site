name: Daily AI Content Update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_site.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SIGNAL-Bot"
          
          # This '|| true' trick prevents the error 128 if files are missing
          git add index.html || true
          git add log.csv || true
          git add sitemap.xml || true
          git add course.html || true
          
          git commit -m "SIGNAL: Daily Intelligence & Course Update" || echo "No changes to commit"
          git push
