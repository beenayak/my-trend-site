name: Daily AI Content Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_site.py

      - name: Sync and Deploy
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SIGNAL-Bot"
          
          # The -A flag catches EVERYTHING. No more pathspec errors.
          git add -A 
          
          # This line prevents the "nothing to commit" error
          git commit -m "SIGNAL: Daily Intelligence & Course Update" || echo "No changes found"
          
          git push
