name: Daily AI Content Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # UPGRADED from v2 to v4 (Supports Node 24)
      - name: Checkout code
        uses: actions/checkout@v4

      # UPGRADED from v2 to v5 (Supports Node 24 and Python 3.12)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_site.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SIGNAL-Bot"
          git add index.html log.csv sitemap.xml
          git commit -m "SIGNAL: Intelligence Update [Node24 Sync]" || echo "No changes"
          git push
