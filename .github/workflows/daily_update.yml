name: Daily AI Content Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# THIS PREVENTS THE "CANCELING" ERROR
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_site.py

      - name: Sync and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SIGNAL-Bot"
          
          # Add all changes (HTML, Log, Sitemap, Course)
          git add -A 
          
          # Only commit if there are actually changes to avoid ghost errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "SIGNAL: Protocol Update [Automated]" && git push)
