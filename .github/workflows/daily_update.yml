name: Daily AI Content Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# This 'concurrency' block prevents two versions of your site 
# from trying to update at the same exact second.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run AI script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_site.py

      - name: Sync to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SIGNAL-Bot"
          git add .
          # Only push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "SIGNAL: Intelligence & Course Update" && git push)
