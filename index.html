<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL // Obsidian Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #fff; cursor: crosshair; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .signal-green { color: #00ff41; text-shadow: 0 0 10px #00ff41; }
        .ticker-wrap { background: #000; border-bottom: 1px solid #111; overflow: hidden; white-space: nowrap; padding: 10px 0; font-size: 10px; letter-spacing: 2px; }
        .ticker-move { display: inline-block; animation: ticker 60s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .btn-premium { background: #fff; color: #000; font-weight: 900; transition: all 0.3s; }
        .btn-premium:hover { background: #00ff41; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="ticker-wrap font-bold">
        <div class="ticker-move uppercase italic">
            <span class="signal-green">[LIVE]</span> NEURAL SYNTHESIS DETECTED // CAPITAL SHIFT IN PROGRESS // BIO-HACKING UPDATE 4.0 // ELITE ACCESS ONLY // SIGNAL LABS 2026 //
        </div>
    </div>

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-3xl font-black tracking-tighter uppercase italic">Signal<span class="signal-green">.</span></div>
        <div class="flex items-center space-x-10 text-[10px] uppercase tracking-[0.3em] font-bold">
            <button onclick="filterSelection('all')" class="hover:text-green-400">All</button>
            <button onclick="filterSelection('ai')" class="hover:text-green-400">AI</button>
            <a href="course.html" class="signal-green">The Academy</a>
            <a href="recommendations.html" class="bg-white text-black px-6 py-2 rounded-full hover:bg-green-400 transition">Access Stack</a>
        </div>
    </nav>

    <header class="max-w-5xl mx-auto py-32 px-6 text-center" data-aos="zoom-in">
        <h1 style="font-family: 'Playfair Display';" class="text-7xl md:text-9xl font-black leading-none mb-8 italic">Clear the <br><span class="text-white/20">Noise.</span></h1>
        <p class="text-xs uppercase tracking-[1em] text-white/40">Automated High-Ticket Intelligence</p>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-40">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10" id="trend-container">
            <!-- AUTOMATION INJECTS HERE -->
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5">
        <p class="text-[9px] uppercase tracking-[0.5em] text-white/20">&copy; 2026 Signal Labs // Distributed via Neural Protocol</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init(); function filterSelection(c) { var x = document.getElementsByClassName("filter-item"); if (c == "all") c = ""; for (var i = 0; i < x.length; i++) { x[i].style.display = "none"; if (x[i].className.indexOf(c) > -1) x[i].style.display = "block"; } }</script>
</body>
</html>
