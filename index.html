<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL // Obsidian Intelligence Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #fff; cursor: crosshair; }
        .signal-green { color: #00ff41; text-shadow: 0 0 12px #00ff41; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .ticker-wrap { background: #000; border-bottom: 1px solid #111; overflow: hidden; white-space: nowrap; padding: 10px 0; font-size: 10px; letter-spacing: 3px; }
        .ticker-move { display: inline-block; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="ticker-wrap font-bold uppercase">
        <div class="ticker-move">
            <span class="signal-green">[LIVE]</span> NEURAL SYNTHESIS ONLINE // CAPITAL FLOWS DETECTED // BIO-HACKING V4.2 // SIGNAL LABS // GLOBAL INTELLIGENCE DISPATCH
        </div>
    </div>

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-3xl font-black tracking-tighter uppercase italic">Signal<span class="signal-green">.</span></div>
        <div class="flex items-center space-x-8 text-[10px] uppercase tracking-[0.3em] font-bold">
            <button onclick="filterSelection('all')" class="hover:text-green-400">All</button>
            <a href="course.html" class="signal-green">The Academy</a>
            <a href="recommendations.html" class="bg-white text-black px-6 py-2 rounded-full transition">The Stack</a>
        </div>
    </nav>

    <header class="max-w-5xl mx-auto py-32 px-6 text-center" data-aos="fade-up">
        <h1 style="font-family: 'Playfair Display';" class="text-7xl md:text-9xl font-black leading-none mb-8 italic">Clear the <br><span class="text-white/10 italic">Noise.</span></h1>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-40">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12" id="trend-container">
            










<!-- SIGNAL_INJECTION_MARKER -->
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init(); function filterSelection(c) { var x = document.getElementsByClassName("filter-item"); if (c == "all") c = ""; for (var i = 0; i < x.length; i++) { x[i].style.display = "none"; if (x[i].className.indexOf(c) > -1) x[i].style.display = "block"; } }</script>
</body>
</html>
